<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Accent Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" />
    </pattern>
    <rect width="1200" height="350" fill="url(#grid)" />
  </g>

  <!-- Decorative Orbit Lines -->
  <circle cx="980" cy="175" r="120" stroke="url(#titleGrad)" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="980" cy="175" r="80" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.25" stroke-dasharray="4 4" />

  <!-- Right Graphic - Center Orb -->
  <g>
    <circle cx="980" cy="175" r="45" fill="url(#nodeGrad)" opacity="0.95" />
    <!-- Play / Graduation Icon -->
    <path d="M 967 160 L 1002 175 L 967 190 Z" fill="#ffffff" />
    <path d="M 967 192 L 980 198 L 997 192" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Satellite Nodes -->
    <!-- LMS Node -->
    <g transform="translate(870, 90)">
      <rect x="0" y="0" width="85" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <text x="42.5" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#f8fafc">🎓 LMS</text>
    </g>

    <!-- LXP Node -->
    <g transform="translate(1015, 75)">
      <rect x="0" y="0" width="85" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="42.5" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#f8fafc">🚀 LXP</text>
    </g>

    <!-- Authoring Node -->
    <g transform="translate(1020, 240)">
      <rect x="0" y="0" width="95" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="47.5" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#f8fafc">⚡ Authoring</text>
    </g>

    <!-- AI RAG Node -->
    <g transform="translate(860, 230)">
      <rect x="0" y="0" width="90" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="45" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#f8fafc">🤖 AI RAG</text>
    </g>
  </g>

  <!-- Left Header Content -->
  <g transform="translate(70, 0)">
    <!-- Top Pill -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#312e81" opacity="0.6" />
      <rect x="0" y="0" width="280" height="32" rx="16" fill="none" stroke="#818cf8" stroke-width="1.5" />
      <text x="140" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#c084fc">🌟 Curated Open-Source &amp; Enterprise Stack</text>
    </g>

    <!-- Main Title Line 1 -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#ffffff">
      Awesome Learning Content
    </text>

    <!-- Main Title Line 2 -->
    <text x="0" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="url(#titleGrad)">
      Platform Landscape 🎓
    </text>

    <!-- Subtitle -->
    <text x="0" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="19" fill="#cbd5e1">
      Enterprise SaaS • Open-Source Infrastructure • LXP • LMS • AI
    </text>

    <!-- Metric Pills -->
    <g transform="translate(0, 272)">
      <g>
        <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="65" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#f8fafc">⚡ 60+ Platforms</text>
      </g>

      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="70" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#f8fafc">🌐 Open Standards</text>
      </g>

      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="70" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#f8fafc">🤖 AI Integration</text>
      </g>
    </g>
  </g>
</svg>
