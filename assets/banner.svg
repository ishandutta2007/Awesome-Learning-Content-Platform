<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1; #a855f7; #ec4899; #6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899; #3b82f6; #8b5cf6; #ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Node Glow -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #cbd5e1;
      }
      .badge-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #f8fafc;
      }
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .float-element {
        animation: float 4s infinite ease-in-out;
      }
      .orbit-line {
        stroke-dasharray: 8 6;
        animation: rotateDash 20s linear infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 12px #a855f7); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes rotateDash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" />
    </pattern>
    <rect width="1200" height="350" fill="url(#grid)" />
  </g>

  <!-- Decorative Orbit Lines -->
  <circle cx="980" cy="175" r="120" stroke="url(#accentGrad)" stroke-width="2" fill="none" opacity="0.4" class="orbit-line" />
  <circle cx="980" cy="175" r="80" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="4 4" />

  <!-- Dynamic Animated Floating Nodes -->
  <g class="float-element">
    <!-- Main Center Icon/Badge graphics -->
    <circle cx="980" cy="175" r="45" fill="url(#accentGrad)" filter="url(#glow)" class="pulse-circle" />
    <path d="M 965 160 L 1000 175 L 965 190 Z" fill="#ffffff" />
    <path d="M 965 190 L 980 197 L 995 190" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Satellite Nodes -->
    <g transform="translate(870, 100)">
      <rect x="0" y="0" width="85" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <text x="42.5" y="21" text-anchor="middle" class="badge-text">🎓 LMS</text>
    </g>

    <g transform="translate(1010, 80)">
      <rect x="0" y="0" width="85" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="42.5" y="21" text-anchor="middle" class="badge-text">🚀 LXP</text>
    </g>

    <g transform="translate(1020, 240)">
      <rect x="0" y="0" width="95" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="47.5" y="21" text-anchor="middle" class="badge-text">⚡ Authoring</text>
    </g>

    <g transform="translate(860, 230)">
      <rect x="0" y="0" width="90" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="45" y="21" text-anchor="middle" class="badge-text">🤖 AI RAG</text>
    </g>
  </g>

  <!-- Left Header Content -->
  <g transform="translate(70, 0)">
    <!-- Top Pill -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="url(#accentGrad)" opacity="0.2" />
      <rect x="0" y="0" width="280" height="32" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" />
      <text x="140" y="21" text-anchor="middle" class="badge-text" fill="#a855f7">🌟 Curated Open-Source & Enterprise Stack</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" class="title">
      Awesome Learning Content
    </text>
    <text x="0" y="192" class="title" fill="url(#accentGrad)" filter="url(#glow)">
      Platform Landscape 🎓
    </text>

    <!-- Subtitle -->
    <text x="0" y="238" class="subtitle">
      Enterprise Platforms • Open-Source Infrastructure • LXP • LMS • AI
    </text>

    <!-- Dynamic Metric Pills -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="65" y="18" text-anchor="middle" class="badge-text">⚡ 60+ Platforms</text>

      <rect x="145" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="215" y="18" text-anchor="middle" class="badge-text">🌐 Open Standards</text>

      <rect x="300" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="370" y="18" text-anchor="middle" class="badge-text">🤖 AI Integration</text>
    </g>
  </g>
</svg>
